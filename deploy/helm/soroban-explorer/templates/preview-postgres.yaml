{{- if .Values.preview.enabled }}
{{- $name := printf "%s-postgres" (include "se.name" .) }}
# Fresh, per-PR database: migrations are applied by db.init() on API start,
# then the seed Job loads seed-data/seed-data.fixture.json.
apiVersion: v1
kind: Secret
metadata: {name: {{ $name }}}
stringData:
  POSTGRES_PASSWORD: preview
  DATABASE_URL: postgres://postgres:preview@{{ $name }}:5432/soroban_explorer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "se.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector: {matchLabels: {app: {{ $name }}}}
  template:
    metadata: {labels: {app: {{ $name }}}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: soroban_explorer}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $name }}, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          resources: {limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $name }}}
spec:
  selector: {app: {{ $name }}}
  ports: [{port: 5432}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "se.name" . }}-seed
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: "{{ .Values.image.registry }}/indexer:{{ .Values.image.tag }}"
          # seed-data/ is mounted from the ConfigMap created by preview.yml.
          command: ["sh", "-c", "node -e \"import('./src/db.js').then(({db}) => db.init())\" && node seed-data/seed.js"]
          env:
            {{- include "se.dbEnv" . | nindent 12 }}
            - name: INDEXER_DIR
              value: /app
          volumeMounts: [{name: seed-data, mountPath: /app/seed-data}]
      volumes:
        - name: seed-data
          configMap: {name: seed-data}
{{- end }}
