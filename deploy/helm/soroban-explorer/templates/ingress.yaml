{{- if .Values.ingress.enabled }}
{{- $host := .Values.preview.enabled | ternary .Values.preview.host .Values.ingress.host }}
{{- range $svc, $paths := dict "api" (list "/api" "/graphql" "/ws" "/health") "frontend" (list "/") }}
{{- $name := printf "%s-%s" (include "se.name" $) $svc }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels: {{- include "se.labels" $ | nindent 4 }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          {{- range $paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service: {name: {{ $name }}, port: {name: http}}
          {{- end }}
---
{{- end }}
{{- end }}
