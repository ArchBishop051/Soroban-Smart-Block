name: DR Drill

# Quarterly regional failover drill in staging (#940). Measures RPO/RTO,
# fails back, and commits the report under docs/dr-reports/.
on:
  schedule:
    - cron: "0 9 15 1,4,7,10 *"
  workflow_dispatch:

concurrency:
  group: staging-deploy-lock
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    environment: staging-dr
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    env:
      ENVIRONMENT: staging
      PRIMARY_CONTEXT: primary
      SECONDARY_CONTEXT: secondary
      PRIMARY_DB: ${{ vars.PRIMARY_DB }}
      REPLICA_DB: ${{ vars.REPLICA_DB }}
      PRIMARY_REGION: ${{ vars.PRIMARY_REGION }}
      SECONDARY_REGION: ${{ vars.SECONDARY_REGION }}
      API_URL: ${{ vars.APP_URL }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      DOMAIN: ${{ vars.APP_HOST }}
      SECONDARY_LB_DNS: ${{ vars.SECONDARY_LB_DNS }}
      LB_ZONE_ID: ${{ vars.LB_ZONE_ID }}
      DR_REPORT: dr-report.md
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DR_ROLE_ARN }}
          aws-region: ${{ vars.PRIMARY_REGION }}
      - uses: azure/setup-helm@v4
      - name: Kube contexts
        run: |
          aws eks update-kubeconfig --region "$PRIMARY_REGION" --name "${{ vars.PRIMARY_CLUSTER }}" --alias primary
          aws eks update-kubeconfig --region "$SECONDARY_REGION" --name "${{ vars.SECONDARY_CLUSTER }}" --alias secondary
      - name: Failover
        run: deploy/dr/failover.sh failover
      - name: Failback
        if: always()
        run: deploy/dr/failover.sh failback
      - name: Commit report
        if: always()
        run: |
          mkdir -p docs/dr-reports
          cp dr-report.md "docs/dr-reports/$(date -u +%F).md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dr-reports && git commit -m "docs(dr): drill report $(date -u +%F)" && git push || true
