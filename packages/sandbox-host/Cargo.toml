[package]
name = "soroban-sandbox-host"
version = "0.1.0"
edition = "2021"
description = "Soroban host compiled to WASM for offline in-browser simulation (#925)"
publish = false

# Independent crate (not part of the root workspace), built with wasm-pack.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Keep in lockstep with the soroban-sdk used by the contracts (21.x).
soroban-env-host = { version = "=21.2.1", features = ["recording_mode"] }
wasm-bindgen = "0.2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
