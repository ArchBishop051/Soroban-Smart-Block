<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soroban Smart Block Explorer</title>
    <script>
      try {
        const theme = localStorage.getItem("sb-theme-preference");
        if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d1117" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("sb-theme-preference");
          var theme = "dark";
          if (pref === "light" || pref === "dark" || pref === "high-contrast") {
            theme = pref;
          } else {
            var prefersHighContrast = window.matchMedia && window.matchMedia("(prefers-contrast: more)").matches;
            if (prefersHighContrast) {
              theme = "high-contrast";
            } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
              theme = "light";
            } else {
              theme = "dark";
            }
          }
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", theme === "light" ? "#f6f8fa" : (theme === "high-contrast" ? "#000000" : "#0d1117"));
          }
        } catch (e) {}
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Soroban Smart Block Explorer" />
    <meta property="og:title" content="Soroban Smart Block Explorer — Decode Stellar contract events" />
    <meta property="og:description" content="Soroban Smart Block Explorer — Decode Stellar contract events" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Soroban Smart Block Explorer — Decode Stellar contract events" />
    <meta name="twitter:description" content="Soroban Smart Block Explorer — Decode Stellar contract events" />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
