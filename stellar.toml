# (active + retired keys during rotation overlap). Verify with
# `soroban-explorer verify <file.json>` or verifySignedResponse() in the SDK.
EXPLORER_SIGNING_KEYS_URL = "https://explorer.example.com/.well-known/explorer-keys.json"

