[package]
name      = "soroban-explorer-contract"
version   = "0.1.0"
edition   = "2021"
license   = "MIT"
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.0.0", features = ["alloc"] }

[features]
testutils = ["soroban-sdk/testutils"]

[lints.rust]
# `cfg(kani)` gates the proof harnesses in proofs/ (see INVARIANTS.md).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
proptest    = { version = "1.4", default-features = false, features = ["alloc"] }

[[test]]
name = "auth_tests"
path = "tests/auth_tests.rs"

[[test]]
name = "storage_bench"
path = "tests/storage_bench.rs"

[[test]]
name = "gas_benchmarks"
path = "tests/gas_benchmarks.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "snapshot"
path = "tests/snapshot.rs"

[[test]]
name = "proptest"
path = "tests/proptest.rs"

[[test]]
name = "budget"
path = "tests/budget.rs"
